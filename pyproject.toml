[project]
name = "comfyui-megapotato"
description = "Photo super-resolution x1-x8 in the cloud through the MegaPotato API (megapotato.app): one node, IMAGE in, IMAGE out, no model download, no VRAM. Stays faithful to the original: sharper faces and textures without invented details. Pay per photo with your own API key; test keys are free."
version = "0.1.1"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/MegaPotato-AI/comfyui-megapotato"
Documentation = "https://megapotato.app/developers"
"Bug Tracker" = "https://github.com/MegaPotato-AI/comfyui-megapotato/issues"

[tool.comfy]
PublisherId = "megapotato"
DisplayName = "MegaPotato AI Upscaler"
Icon = "https://raw.githubusercontent.com/MegaPotato-AI/comfyui-megapotato/main/icon.png"
