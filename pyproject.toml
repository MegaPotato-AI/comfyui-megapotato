[project]
name = "comfyui-megapotato"
description = "#1 of 18 AI upscalers in our reproducible 2026 benchmark and the cheapest of the leaders (megapotato.app/blog/best-ai-image-upscalers-2026). The MegaPotato AI upscaler (megapotato.app) as one node: photo super-resolution x1-x8 on cloud GPUs through the API, IMAGE in, IMAGE out, real detail and nothing invented. No model download, no VRAM; pay per photo with your own API key, test keys are free."
version = "0.1.2"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/MegaPotato-AI/comfyui-megapotato"
Documentation = "https://megapotato.app/developers"
"Bug Tracker" = "https://github.com/MegaPotato-AI/comfyui-megapotato/issues"

[tool.comfy]
PublisherId = "megapotato"
DisplayName = "MegaPotato AI Upscaler"
Icon = "https://raw.githubusercontent.com/MegaPotato-AI/comfyui-megapotato/main/icon.png"
